[package]
name = "treasury_streams"
version = "0.1.0"
edition = "2021"
description = "Streaming-payments treasury contract for contributor grants (Drips/Sablier-style)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
proptest = "1"
