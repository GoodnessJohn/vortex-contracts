[package]
name = "governor"
version = "0.1.0"
edition = "2021"
description = "Stake-weighted Governor for protocol parameter changes"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }
vortex-common = { path = "../vortex-common" }
solver_registry = { path = "../solver_registry" }
timelock = { path = "../timelock" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
solver_registry = { path = "../solver_registry", features = ["testutils"] }
timelock = { path = "../timelock", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

# `governor` is not a member of the repository's root workspace, and the root
# manifest currently cannot be loaded at all (it lists two members whose
# directories do not exist — `directory` and `arbiter_panel`; issues #554 /
# #555).  Declaring this crate as its own workspace root keeps it
# independently buildable and testable, and gives it its own `Cargo.lock`,
# exactly like the other contract crates in the tree
# (`intent_settlement/Cargo.lock`, `proof_registry/Cargo.lock`,
# `solver_registry/Cargo.lock`).
[workspace]
